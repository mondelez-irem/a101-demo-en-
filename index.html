function seeded(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}
const MOCK = (function(){
  const rnd=seeded(1907);
  const daily=[]; let base=1.6;
  const start=new Date(2026,5,1), end=new Date(2026,6,20);
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const dow=d.getDay(); let n;
    if(dow===0){ n=0; }                                   // pazar sıfır
    else { base += (rnd()<0.68?0.28:-0.12);                // kademeli artış, ara sıra düşüş
           n=Math.max(0, Math.round(base + (rnd()*5-2.4))); }
    daily.push({d:new Date(d), n});
  }
  const codes=[...new Set(DATA.filter(x=>x.dk).map(x=>x.dk))];
  const entered=codes.slice(0,29);                        // 58 depodan 29'u giriş yaptı
  // son 12 günün log satırları — YALNIZCA A101 depo girişleri
  const rows=[];
  for(let g=11; g>=0; g--){
    const day=new Date(2026,6,20); day.setDate(day.getDate()-g);
    if(day.getDay()===0) continue;
    const cnt=2+Math.floor(rnd()*5);
    for(let i=0;i<cnt;i++){
      const t=new Date(day); t.setHours(8+Math.floor(rnd()*10), Math.floor(rnd()*60));
      const dep=entered[Math.floor(rnd()*entered.length)];
      rows.push({t, u:dep, olay:"giris", detay:"Warehouse sign-in · A101 "+(DEPO_NAME[dep]||dep)});
    }
  }
  rows.sort((a,b)=>b.t-a.t);
  // Son depo girişleri: 15 rastgele (farklı) depo
  const shuffled=[...entered].sort(()=>rnd()-0.5).slice(0,15);
  const recent=shuffled.map((dep,i)=>{ const t=new Date(2026,6,20); t.setDate(t.getDate()-(i%6)); t.setHours(8+Math.floor(rnd()*10),Math.floor(rnd()*60)); return {t,u:dep,olay:"giris",detay:"Warehouse sign-in · A101 "+(DEPO_NAME[dep]||dep)}; }).sort((a,b)=>b.t-a.t);
  return {daily, entered, rows, recent, total:58};
})();

function distApply(){
  const base=visible();
  let r=base.slice();
  if(S.distAtf==="All in Transit")r=r.filter(x=>YOLDA.includes(x.atf));
  else if(S.distAtf!=="All")r=r.filter(x=>x.atf===S.distAtf);
  if(S.distDepo!=="All")r=r.filter(x=>x.dk===S.distDepo);
  if(S.distProd)r=r.filter(x=>(x.u||"").toLowerCase().includes(S.distProd.toLowerCase()));
  if(S.distNo)r=r.filter(x=>(x.del||"").includes(S.distNo)||(x.bill||"").includes(S.distNo));
  const sorts={atf:(a,b)=>a.atf.localeCompare(b.atf),urun:(a,b)=>(a.u||"").localeCompare(b.u||""),koli:(a,b)=>b.kon-a.kon,eta:(a,b)=>(a.eta||"").localeCompare(b.eta||"")};
  r=[...r].sort(sorts[S.distSort]);
  const pages=Math.ceil(r.length/PAGE)||1, pg=Math.min(S.distPg,pages-1), slice=r.slice(pg*PAGE,pg*PAGE+PAGE);
  const rows=slice.map(d=>`<tr><td class="mono" style="color:#1A1A22;">${esc(d.del)||"—"}</td><td>${esc(d.da)}</td><td style="font-weight:500;">${esc(d.u)}</td><td class="mono" style="text-align:center;">${d.kon}</td><td><span class="pill" style="${pillStyle(d.atf)}">${d.ic} ${d.atf}</span></td><td class="mono">${esc(d.pl)||"—"}</td><td>${esc(d.eta)||"—"}</td></tr>`).join("")||`<tr><td colspan="7" style="color:var(--muted);padding:20px;text-align:center;">No records found.</td></tr>`;
  const opt=(v,l)=>`<option value="${v}" ${S.distSort===v?'selected':''}>${l}</option>`;
  el("distbox").innerHTML=`<div class="card" style="overflow:hidden;">
      <div style="padding:14px 20px;border-bottom:1px solid #F1EFF6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span style="font-weight:700;">${r.length} records</span><select class="chip" style="margin-left:auto;" onchange="S.distSort=this.value;S.distPg=0;distApply();">${opt('atf','ATF Status')}${opt('urun','Product (A–Z)')}${opt('koli','Cases (High to Low)')}${opt('eta','Estimated Delivery')}</select></div>
      <div style="overflow-x:auto;"><table style="min-width:760px;"><thead><tr style="background:#FAFAFC;"><th style="padding-left:20px;">Delivery Number</th><th>Warehouse</th><th>Product</th><th style="text-align:center;">Confirmed</th><th>ATF Status</th><th>License Plate</th><th>Estimated Delivery</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${pager(pages,pg,'S.distPg=P;distApply();',r.length)}</div>`;
}

/* --- ÜRÜN PERFORMANSI (ürün bazlı, kategorili, filtrelenebilir) --- */
function prodAgg(rows){
  const m={};
  rows.forEach(x=>{
    if(!x.u) return;
    const p=(m[x.u]=m[x.u]||{u:x.u,cat:brandOf(x.u),sip:0,kon:0,reached:new Set(),missed:new Set()});
    p.sip+=x.sip; p.kon+=x.kon;
    if(x.dk){ if(x.kon>0) p.reached.add(x.dk); else if(x.sip>0) p.missed.add(x.dk); }
  });
  return Object.values(m).map(p=>({...p,cfr:p.sip?Math.round(1000*p.kon/p.sip)/10:0,reachedN:p.reached.size,missedN:[...p.missed].filter(d=>!p.reached.has(d)).length}));
}
function vReports(){
  if(!S.prodCat)S.prodCat="All";
  const cats=["All",...[...new Set(prodAgg(visible()).map(p=>p.cat))].sort()];
  const catOpts=cats.map(c=>`<option value="${esc(c)}" ${S.prodCat===c?'selected':''}>${esc(c)}</option>`).join("");
  el("content").innerHTML=`
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:end;">
      <div><label class="lbl">Category</label><br><select class="inp" style="margin-top:6px;min-width:180px;" onchange="S.prodCat=this.value;S.prodExpand=null;prodApply();">${catOpts}</select></div>
      <div style="flex:1;min-width:200px;"><label class="lbl">Search Products</label><br><input class="inp" style="margin-top:6px;" value="${esc(S.prodQ||'')}" placeholder="Product name..." oninput="S.prodQ=this.value;S.prodExpand=null;prodApply();"></div>
      <div id="prodcount" style="color:var(--muted);font-size:12.5px;padding-bottom:12px;"></div>
    </div>
    <div id="prodbox"></div>`;
  prodApply();
}
function prodApply(){
  let f=prodAgg(visible());
  if(S.prodCat && S.prodCat!=="All")f=f.filter(p=>p.cat===S.prodCat);
  if(S.prodQ)f=f.filter(p=>p.u.toLowerCase().includes(S.prodQ.toLowerCase()));
  f=f.sort((a,b)=>b.sip-a.sip);
  if(el("prodcount"))el("prodcount").textContent=f.length+" products";
  const rows=f.map(p=>{
    const w=p.cfr<90, id=p.u.replace(/'/g,"");
    const detail=S.prodExpand===p.u?`<tr><td colspan="6" style="background:#FAF9FC;padding:12px 20px;font-size:12.5px;color:var(--label);"><b>Warehouses supplied (${p.reachedN}):</b> ${[...p.reached].join(", ")||"—"}<br><b style="color:var(--danger);">Unfulfilled (${p.missedN}):</b> ${[...p.missed].filter(x=>!p.reached.has(x)).join(", ")||"—"}</td></tr>`:"";
    return `<tr style="cursor:pointer;" onclick="S.prodExpand=(S.prodExpand==='${id}'?null:'${id}');prodApply();"><td style="font-weight:500;color:#1A1A22;">${esc(p.u)}</td><td><span class="pill" style="background:#EDE7F6;color:#4B2E83;">${esc(p.cat)}</span></td><td class="mono" style="text-align:center;">${Math.round(p.sip)}</td><td class="mono" style="text-align:center;">${Math.round(p.kon)}</td><td style="text-align:center;"><span class="pill" style="${w?'background:#FDECEA;color:#E0483C;':'background:#F4FBF7;color:#157F4B;'}">${p.cfr}%</span></td><td class="mono" style="text-align:center;">${p.reachedN}${p.missedN?` <span style="color:var(--danger);">(-${p.missedN})</span>`:""}</td></tr>${detail}`;
  }).join("")||`<tr><td colspan="6" style="color:var(--muted);padding:20px;text-align:center;">No products found.</td></tr>`;
  el("prodbox").innerHTML=`<div class="card" style="overflow:hidden;"><div style="padding:14px 20px;border-bottom:1px solid #F1EFF6;font-size:12.5px;color:var(--muted);">Select a product to see which warehouses received stock and which had unfulfilled orders.</div>
    <div style="overflow-x:auto;"><table style="min-width:720px;"><thead><tr style="background:#FAFAFC;"><th style="padding-left:20px;">Product</th><th>Category</th><th style="text-align:center;">Cases Ordered</th><th style="text-align:center;">Cases Confirmed</th><th style="text-align:center;">CFR</th><th style="text-align:center;">Warehouses Supplied</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* --- VERİ YÜKLE --- */
function vImport(){
  el("content").innerHTML=`<div style="max-width:720px;">
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      ${dropCard("📋","SAP Data","ZNMOTC export · .xlsx")}
      ${dropCard("🚚","Omnia Data","ATF + system number · .xlsx")}
    </div>
    <button class="btnp" style="margin-top:18px;background:var(--blue);">🔄 Process and Update Data</button>
    <div class="card" style="margin-top:18px;padding:18px 20px;color:var(--label);font-size:13.5px;line-height:1.7;">This demo uses <b>A101 (Yeni Mağazacılık)</b> data (${DATA.length} rows across ${depoCodes.length} warehouses) merged from SAP and Omnia. In the live system, daily Excel files are uploaded here and the server merges them to update the database.</div>
  </div>`;
}
function dropCard(i,t,h){return `<label style="flex:1;min-width:220px;border:1.5px dashed var(--border);border-radius:16px;background:#fff;padding:26px 20px;text-align:center;cursor:pointer;display:block;"><div style="font-size:30px;">${i}</div><div style="font-weight:700;margin-top:8px;">${t}</div><div style="font-size:12.5px;color:var(--muted);margin-top:4px;">${h}</div><div style="font-size:12.5px;color:var(--mdlz);margin-top:10px;font-weight:600;">Choose a file or drag it here</div></label>`;}

/* --- BİLGİ İSTEKLERİ --- */
function vRequests(){
  if(S.user.rol==="A101_DEPO"){
    el("content").innerHTML=`<div class="card" style="max-width:560px;padding:24px;">
      <div style="font-weight:800;font-size:15px;margin-bottom:4px;">📬 Send Information Request</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Send a note to the Mondelez team.</div>
      <div id="rok"></div>
      <label class="lbl">Order / Delivery Number</label><input id="rno" class="inp" style="margin-top:6px;margin-bottom:12px;" placeholder="Optional">
      <label class="lbl">Your Note</label><textarea id="rmsg" class="inp" style="margin-top:6px;min-height:100px;"></textarea>
      <button class="btnp" style="margin-top:14px;" onclick="sendReq()">Send →</button>
    </div>`; return;
  }
  const rows=REQUESTS.map(r=>`<div style="padding:16px 22px;border-top:1px solid #F1EFF6;display:flex;gap:14px;"><span class="mono" style="width:auto;min-width:60px;height:38px;padding:0 8px;border-radius:10px;background:#EDE7F6;color:var(--mdlz);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;">${esc(r.depoCodeu||"—")}</span><div style="flex:1;"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><span style="font-weight:700;font-size:13.5px;">${esc(r.depo)}</span>${r.no?`<span class="mono" style="font-size:11.5px;color:var(--muted);">${esc(r.no)}</span>`:""}${r.durum==="yeni"?`<span style="font-size:10.5px;font-weight:700;color:var(--danger);background:#FDECEA;padding:1px 7px;border-radius:999px;">New</span>`:""}</div><div style="font-size:13px;color:var(--label);margin-top:3px;">${esc(r.not)}</div></div><span style="font-size:11.5px;color:#B0AAC0;white-space:nowrap;">${r.t.toLocaleString('en-GB')}</span></div>`).join("")||`<div style="padding:24px;color:var(--muted);text-align:center;">No requests yet.</div>`;
  el("content").innerHTML=`<div class="card" style="max-width:780px;overflow:hidden;"><div style="padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #F1EFF6;"><div style="font-weight:800;font-size:15px;">📬 Incoming Information Requests</div><span style="padding:4px 12px;border-radius:999px;background:#FDECEA;color:var(--danger);font-weight:700;font-size:12px;">${REQUESTS.length} records</span></div>${rows}</div>`;
}
function sendReq(){const no=el("rno").value.trim(),msg=el("rmsg").value.trim();if(!msg){el("rok").innerHTML=`<div class="error" style="color:var(--danger);margin-bottom:10px;">Enter a note.</div>`;return;}REQUESTS.unshift({depo:S.user.ad,depoCodeu:S.user.depo,no,not:msg,durum:"yeni",t:new Date()});log("bilgi_istegi","Request: "+no);el("rok").innerHTML=`<div style="color:var(--green);font-weight:600;margin-bottom:10px;">Your request has been sent ✓</div>`;el("rno").value="";el("rmsg").value="";}

/* --- KULLANICI YÖNETİMİ --- */
function vUsers(){
  const list=USERS.map(u=>`<tr><td class="mono" style="color:#1A1A22;">${esc(u.u)}${u.u===S.user.u?' <span style="color:var(--muted);">(you)</span>':''}</td><td>${esc(u.ad)}</td><td>${roleLabel(u.rol)}</td><td class="mono">${esc(u.depo)||"—"}</td><td style="text-align:right;white-space:nowrap;">${u.u===S.user.u?'':`<button class="chip" style="color:var(--danger);border-color:#F3C9C6;" onclick="delUser('${u.u}')">Delete</button>`}</td></tr>`).join("");
  el("content").innerHTML=`
    <div class="card" style="padding:20px 22px;margin-bottom:18px;">
      <div style="font-weight:800;font-size:15px;margin-bottom:14px;">➕ Add New User</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;">
        <div><label class="lbl">Username</label><input id="nu" class="inp" style="margin-top:6px;"></div>
        <div><label class="lbl">Full Name</label><input id="nad" class="inp" style="margin-top:6px;"></div>
        <div><label class="lbl">Password</label><input id="np" class="inp" style="margin-top:6px;" type="password"></div>
        <div><label class="lbl">Role</label><select id="nr" class="inp" style="margin-top:6px;" onchange="el('ndw').style.display=this.value==='A101_DEPO'?'block':'none';"><option value="A101_DEPO">A101 Warehouse</option><option value="MDLZ_GOZLEMCI">Mondelez – Viewer</option><option value="MDLZ_ETKILI">Mondelez – Administrator</option></select></div>
        <div id="ndw"><label class="lbl">Warehouse Code</label><input id="nd" class="inp" style="margin-top:6px;"></div>
        <button class="btnp" onclick="addUser()">Add</button>
      </div>
      <div id="uok" style="margin-top:10px;"></div>
    </div>
    <div class="card" style="overflow:hidden;"><div style="overflow-x:auto;"><table style="min-width:640px;"><thead><tr style="background:#FAFAFC;"><th style="padding-left:20px;">Username</th><th>Full Name</th><th>Role</th><th>Warehouse</th><th></th></tr></thead><tbody>${list}</tbody></table></div></div>`;
}
function addUser(){const u=el("nu").value.trim(),ad=el("nad").value.trim(),p=el("np").value,r=el("nr").value,d=el("nd").value.trim();if(!u||!p){el("uok").innerHTML=`<span style="color:var(--danger);">Enter a username and password.</span>`;return;}if(USERS.find(x=>x.u===u)){el("uok").innerHTML=`<span style="color:var(--danger);">That username is already in use.</span>`;return;}USERS.push({u,ad,p,rol:r,depo:r==="A101_DEPO"?d:""});log("kullanici_ekle","New: "+u);vUsers();}
function delUser(u){if(!confirm("Delete user "+u+"?"))return;USERS=USERS.filter(x=>x.u!==u);log("kullanici_sil","Deleted: "+u);vUsers();}

/* --- AKTİVİTE (A101 depo girişleri: sayaç + grafik + loglar) --- */
function loginChart(){
  // günlükleri haftalık ORTALAMAYA çevir (pazar sıfırları düzleşsin)
  const D=MOCK.daily, weeks=[];
  for(let i=0;i<D.length;i+=7){const c=D.slice(i,i+7);weeks.push({d:c[0].d,n:Math.round(c.reduce((s,p)=>s+p.n,0)/c.length*10)/10});}
  const W=920,H=185,pad=30;
  const maxN=Math.max(...weeks.map(x=>x.n),1), xw=(W-pad*2)/(Math.max(1,weeks.length-1));
  const X=i=>pad+i*xw, Y=n=>H-pad-(n/maxN)*(H-pad*2);
  const line=weeks.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.n).toFixed(1)}`).join(" ");
  const area=`M${X(0)},${H-pad} `+weeks.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.n).toFixed(1)}`).join(" ")+` L${X(weeks.length-1).toFixed(1)},${H-pad} Z`;
  const dots=weeks.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.n).toFixed(1)}" r="3.5" fill="#4B2E83"/><text x="${X(i).toFixed(1)}" y="${(Y(p.n)-9).toFixed(1)}" font-size="10" fill="#4B2E83" text-anchor="middle" font-weight="700">${p.n}</text>`).join("");
  const xlab=weeks.map((p,i)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#9A93AC" text-anchor="middle">${p.d.getDate()}.${p.d.getMonth()+1}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B2E83" stop-opacity="0.2"/><stop offset="1" stop-color="#4B2E83" stop-opacity="0"/></linearGradient></defs><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#EEECF4"/><path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#4B2E83" stroke-width="2.2"/>${dots}${xlab}</svg>`;
}
function vActivity(){
  const entered=MOCK.entered.length, total=MOCK.total, pct=Math.round(entered/total*100);
  const dl=(MOCK.recent||[]).slice(0,15);   // 15 rastgele son A101 depo girişi
  const rows=dl.map(l=>`<tr><td class="mono" style="white-space:nowrap;">${l.t.toLocaleString('en-GB')}</td><td class="mono">${esc(l.u)}</td><td style="color:var(--label);">${esc(l.detay)}</td></tr>`).join("")||`<tr><td colspan="3" style="color:var(--muted);padding:20px;text-align:center;">No records.</td></tr>`;
  el("content").innerHTML=`
    <div class="card" style="padding:20px 22px;margin-bottom:18px;max-width:420px;">
      <div style="font-size:12.5px;color:var(--muted);font-weight:700;">WAREHOUSES THAT SIGNED IN</div>
      <div style="font-size:34px;font-weight:800;margin:2px 0;">${entered} <span style="font-size:18px;color:var(--muted);font-weight:600;">/ ${total}</span></div>
      <div style="height:10px;background:#F1EFF6;border-radius:6px;overflow:hidden;margin-top:6px;"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#4B2E83,#0A57C2);"></div></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">${pct}% of the 58 A101 warehouses have signed in.</div>
    </div>
    <div class="card" style="padding:20px 24px;margin-bottom:18px;">
      <div style="font-weight:800;font-size:15px;">📈 Average Daily Sign-ins by Week</div>
      <div style="font-size:13px;color:var(--label);margin:8px 0 14px;line-height:1.9;">June: <b>17 warehouses</b> signed in<br>July: <b style="color:#0A57C2;">29 warehouses</b> signed in</div>
      ${loginChart()}
    </div>
    <div class="card" style="overflow:hidden;"><div style="padding:16px 20px;font-weight:800;font-size:15px;border-bottom:1px solid #F1EFF6;">Recent Warehouse Sign-ins</div><div style="overflow-x:auto;"><table style="min-width:520px;"><thead><tr style="background:#FAFAFC;"><th style="padding-left:20px;">Time</th><th>Warehouse Code</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* --- Pagelama --- */
function pager(pages,pg,cb,total){
  if(pages<=1)return `<div style="padding:12px 20px;font-size:12.5px;color:var(--muted);">${total} records</div>`;
  let nums="";const start=Math.max(0,Math.min(pg-2,pages-5));for(let i=start;i<Math.min(pages,start+5);i++)nums+=`<button onclick="(function(P){${cb}})(${i})" style="min-width:34px;padding:7px 11px;border-radius:9px;border:1px solid ${i===pg?'var(--mdlz)':'var(--border)'};background:${i===pg?'var(--mdlz)':'#fff'};color:${i===pg?'#fff':'var(--label)'};font-weight:600;font-size:13px;">${i+1}</button>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:16px;flex-wrap:wrap;"><span style="font-size:12.5px;color:var(--muted);">${total} records · Page ${pg+1}/${pages}</span><div style="display:flex;gap:4px;"><button onclick="(function(P){${cb}})(${Math.max(0,pg-1)})" style="padding:7px 11px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:13px;">← Previous</button>${nums}<button onclick="(function(P){${cb}})(${Math.min(pages-1,pg+1)})" style="padding:7px 11px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:13px;">Next →</button></div></div>`;
}

renderLogin();
</script>
</body>
</html>
